name: Build and deploy Python project to Azure Function App - chatbotkx

on:
  push:
    branches:
      - Chat_Bots
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # Path del proyecto, normalmente raíz
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 👇 Limpiar dependencias anteriores
      - name: Clean old dependencies
        run: rm -rf .python_packages

      # 👇 Instalar dependencias en carpeta .python_packages (estructura que Azure Functions espera)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt
          # Forzar que se instale la versión correcta de openai
          pip install --target=".python_packages/lib/site-packages" "openai>=1.42.0"

      # Crear zip de todo el proyecto + dependencias
      - name: Zip artifact for deployment
        run: zip -r release.zip . -x '*.git*' 'venv/*'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: |
          unzip release.zip
          rm release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CFD52E2446754B81BBD5FFC549FCB0D7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_717F22C9D7BA4C95AE74F8CEF6B788D7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2FCF6BE754C34813AA570450C62A77D5 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'chatbotkx'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}